name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/magic-number

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/magic-number/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: |
          python -m py_compile app.py
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security check
        env: 
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          # Fail only if HIGH severity vulnerabilities are found
          python -m bandit -r . -q --exclude ./tests -lll  || { echo "Bandit issues found"; exit 1; }
    
          # Safety will report everything but only return a failing exit code for high/critical
          python -m safety \
            --key "$SAFETY_API_KEY" \
            --stage cicd \
             scan \
             --output json \
             --cvss-severity=high,critical || {
            echo "Safety: high/critical vulnerabilities detected" >&2
            exit 1
          }
          
      - name: Run unit tests
        run: |
          export PYTHONPATH=${{ github.workspace }}/apps/magic-number
          pytest --junitxml=pytest.xml --cov-report=xml:../../coverage.xml --cov=. --cov-report=term-missing

      - name: Comment coverage report on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ../../coverage.xml
          junitxml-path: ./pytest.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: apps/magic-number/Dockerfile
          failure-threshold: warning

      - name: Enforce hadolint (CLI)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/apps/magic-number":/workdir -w /workdir hadolint/hadolint:v2.12.0 hadolint Dockerfile

      - name: Validate Docker build
        if: ${{ success() }}
        run: |
          docker build --no-cache --progress=plain -t test-image .

      - name: Integration smoke test
        if: ${{ success() }}
        run: |
          set -euo pipefail

          container_name="magic-number-test"

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run \
            --detach \
            --name "$container_name" \
            --publish 5000:5000 \
            test-image

          curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:5000/