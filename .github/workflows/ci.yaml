name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/magic-number

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/magic-number/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint Python
        run: |
          python -m py_compile app.py
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security check
        run: |
          bandit -r . -q || true
          safety check --json || true

      - name: Run unit tests
        run: |
          pytest --junitxml=pytest.xml --cov-report=xml:../../coverage.xml --cov=. --cov-report=term-missing

      - name: Comment coverage report on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./coverage.txt
          junitxml-path: ./pytest.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: apps/magic-number/Dockerfile

      - name: Validate Docker build
        run: |
          docker build -t test-image .

      - name: Integration smoke test
        run: |
          docker build -t magic-number:test .
          docker run -d --name magic-number-test -p 5000:5000 magic-number:test
          curl -f http://127.0.0.1:5000/ || exit 1
          docker rm -f magic-number-test